# Pre-commit hooks — fail fast, locally, before CI.
# Install with: make setup   (or: pre-commit install)
default_language_version:
  python: python3

repos:
  # --- Generic hygiene -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # --- Python: lint + format (ADR-014) --------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- Secret scanning (NFR-SEC-007) ----------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Conventional Commits (NFR-MAINT-005) ---------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  # --- Project-specific: data contracts must stay valid (ADR-015) -----------
  - repo: local
    hooks:
      - id: validate-data-contracts
        name: Validate Avro data contracts
        entry: python scripts/validate_contracts.py --quiet
        language: system
        files: ^data-platform/schemas/avro/.*\.avsc$
        pass_filenames: false

      # Fires on the contracts AND on the generated output, so that both an edited
      # contract and a hand-edited generated file are caught before the commit exists.
      - id: generated-contract-code-is-fresh
        name: Generated contract code is up to date
        entry: uv run python data-platform/schemas/generate.py --check
        language: system
        files: ^(data-platform/schemas/avro/.*\.avsc|libs/telecom-common/src/telecom_common/contracts/.*)$
        pass_filenames: false

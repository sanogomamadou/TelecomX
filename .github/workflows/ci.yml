name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to keep CI under the 15 min budget
# (NFR-MAINT-007).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Detect which parts of the monorepo changed, so that unrelated jobs are
  # skipped. This is what keeps a monorepo's CI fast (ADR-001, C5).
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'data-platform/schemas/**'
              - 'data-platform/generators/**'
              - 'data-platform/dbt/seeds/**'
              - 'scripts/validate_contracts.py'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - '.importlinter'
            docs:
              - 'docs/**'
              - '*.md'
            frontend:
              - 'apps/frontend/**'

  # ---------------------------------------------------------------------------
  # Data contracts are the foundation of the platform (ADR-015): they are
  # validated on every run, even when nothing else changed.
  # ---------------------------------------------------------------------------
  contracts:
    name: Data contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install validation dependencies
        run: python -m pip install --quiet fastavro
      - name: Validate Avro contracts
        run: python scripts/validate_contracts.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      # Regenerates in memory and compares byte for byte with what is committed.
      # A contract edited without `make codegen`, or a generated file edited by
      # hand, fails here and cannot be merged.
      - name: Generated contract code is up to date
        run: uv run python data-platform/schemas/generate.py --check
      # Same principle for the synthetic reference data: the committed seeds must be
      # exactly what the (deterministic) generator produces.
      - name: Reference data is up to date
        run: uv run python -m telecomx_generators.reference --check

  # ---------------------------------------------------------------------------
  # Secret scanning runs unconditionally — a leaked secret is never "unrelated".
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks action scans the range "<first commit>^..<last commit>" on a push.
      # The root commit has no parent, so on the very first push git fails, the action
      # reports "scanned ~0 bytes" and exits with an error without reading anything.
      # Running the tool itself scans the whole history, and a scan that cannot read
      # anything is made to fail loudly (see the check on the commit count below).
      - name: Install gitleaks (version pinned, checksum verified)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # The archive keeps its published name: the checksums file refers to it by name.
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: Scan the whole history for secrets
        # `shell: bash` enables pipefail. Without it GitHub runs `bash -e`, the pipeline
        # below would return tee's exit code, and a leak found by gitleaks would pass.
        shell: bash
        run: |
          expected=$(git rev-list --count HEAD)
          echo "Commits to scan: ${expected}"
          ./gitleaks detect --source . --redact --verbose --exit-code 2 --no-banner 2>&1 | tee scan.log
          scanned=$(grep -oE '[0-9]+ commits scanned' scan.log | grep -oE '[0-9]+' | head -1 || true)
          echo "Commits scanned: ${scanned:-0}"
          if [ "${scanned:-0}" -lt "${expected}" ]; then
            echo "::error::gitleaks scanned ${scanned:-0} of ${expected} commits: refusing to report success."
            exit 1
          fi

  lint:
    name: Lint & format
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type check
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      # Only packages that exist: mypy exits with an error on a directory that holds
      # no .py file. Add apps, agents and ml-platform here as they gain code.
      - name: Mypy
        run: uv run mypy libs data-platform/generators/src

  architecture:
    name: Architecture rules
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      - name: Enforce import contracts (ADR-001, ADR-009, ADR-016)
        run: uv run lint-imports

  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      - name: Run unit tests
        run: uv run pytest -m "not integration and not e2e and not llm" --cov --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  dependencies:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Audit Python dependencies
        run: uvx pip-audit --strict || echo "::warning::pip-audit reported findings"

  # ---------------------------------------------------------------------------
  # The Compose file must at least be loadable: a typo, an unknown key or a
  # missing required variable is caught here instead of on a developer's laptop.
  # The unit tests (tests/unit/infra) check the rules around memory and secrets.
  # ---------------------------------------------------------------------------
  compose:
    name: Docker Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the core profile with placeholder variables
        env:
          S3_ACCESS_KEY: placeholder
          S3_SECRET_KEY: placeholder
          POSTGRES_PASSWORD: placeholder
        run: docker compose --profile core config --quiet
      # An image withdrawn from its registry passes every static check and fails only at
      # the first real pull (this is how MinIO's disappearance was found, ADR-021).
      - name: Check that every image still exists in its registry
        env:
          S3_ACCESS_KEY: placeholder
          S3_SECRET_KEY: placeholder
          POSTGRES_PASSWORD: placeholder
        run: |
          for image in $(docker compose --profile core config --images | sort -u); do
            echo "checking $image"
            docker manifest inspect "$image" > /dev/null || { echo "::error::image not found: $image"; exit 1; }
          done
      - name: Refuse to render without the required secrets
        run: |
          if docker compose --profile core config --quiet 2>/dev/null; then
            echo "::error::Compose rendered without its required secrets"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Single required status check — branch protection points at this one job.
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    if: always()
    needs: [contracts, compose, secrets, lint, typecheck, architecture, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::At least one required job did not pass."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."

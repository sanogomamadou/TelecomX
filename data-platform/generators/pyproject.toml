[project]
name = "telecomx-generators"
version = "0.1.0"
description = "Deterministic synthetic data for the TelecomX platform: reference data now, events next"
requires-python = ">=3.11"
license = { text = "MIT" }

# Reference data and event generation use only telecom-common. Publishing to Kafka is the
# one place that needs outside libraries (lot 1.6), and they stay out of telecom-common
# on purpose: that library is imported everywhere and must not carry a Kafka client
# (enforced by .importlinter).
#
#   confluent-kafka  the Kafka producer (librdkafka: idempotence, acks=all, batching)
#   fastavro         Avro binary encoding; the Schema Registry itself is reached with
#                    the standard library, which keeps the dependency list short
dependencies = [
    "telecom-common",
    "confluent-kafka>=2.5",
    "fastavro>=1.9",
]

[tool.uv.sources]
telecom-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecomx_generators"]

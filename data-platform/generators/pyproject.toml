[project]
name = "telecomx-generators"
version = "0.1.0"
description = "Deterministic synthetic data for the TelecomX platform: reference data now, events next"
requires-python = ">=3.11"
license = { text = "MIT" }

# No third-party dependency of its own: it builds on telecom-common. Event generators
# (lot 1.4) will add the Kafka producer client, and only then.
dependencies = [
    "telecom-common",
]

[tool.uv.sources]
telecom-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecomx_generators"]

# =============================================================================
#  Kafka topics of the platform - single source of truth (ADR-002, FR-M1-008)
#
#  Read by data-platform/kafka/create-topics.sh (the kafka-init container) and
#  checked against the Avro contracts by tests/unit/infra/test_topics.py.
#
#  Columns (whitespace separated):
#    topic               name, must match a contract's telecomx.topic (or <it>.dlq)
#    partitions          sized for PRODUCTION throughput; kept in dev on purpose so
#                        real parallelism is exercised (ADR-002)
#    dev_retention_hours retention applied locally (disk is scarce)
#    prod_retention_days documented target, applied by the Helm chart (Phase 6)
#
#  Dev retention is 24 h everywhere except DLQs (72 h): a rejected message must
#  survive a night and a weekend start-up long enough to be looked at.
# =============================================================================
# topic                      partitions  dev_retention_hours  prod_retention_days
network.metrics              12          24                   7
network.alarms               6           24                   30
device.events                6           24                   7
cdr.events                   24          24                   3
data.sessions                18          24                   3
sms.events                   12          24                   3
ussd.events                  6           24                   3
recharge.events              6           24                   30
bundle.events                6           24                   30
mobilemoney.transactions     12          24                   90
customer.events              6           24                   90
